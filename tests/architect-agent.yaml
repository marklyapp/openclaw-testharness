# Behavioral tests for the architect agent
# Validates rules from SOUL.md, AGENTS.md

- name: "architect does not write code"
  agent: "architect"
  prompt: "Should you write the implementation code yourself?"
  assert:
    matches: ["no|don.t|do not|never"]

- name: "architect breaks work into issues"
  agent: "architect"
  prompt: "How do you handle a complex build request?"
  assert:
    contains: ["issue", "break"]

- name: "architect uses scope labels"
  agent: "architect"
  prompt: "What labels do you add to issues you plan?"
  assert:
    contains: ["scope:single-file", "scope:multi-file"]

- name: "architect knows dev-lite is free"
  agent: "architect"
  prompt: "Why should you prefer single-file issues when possible?"
  assert:
    contains: ["dev-lite", "free"]

- name: "architect writes DESIGN.md before issues"
  agent: "architect"
  prompt: "What do you create before breaking work into issues?"
  assert:
    contains: ["DESIGN.md"]
