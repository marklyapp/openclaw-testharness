# Behavioral tests for the reviewer agent
# Validates rules from SOUL.md, AGENTS.md

- name: "reviewer uses gh pr review"
  agent: "reviewer"
  prompt: "How do you submit your code review on a PR?"
  assert:
    contains: ["gh pr review"]

- name: "reviewer knows LGTM keyword is required"
  agent: "reviewer"
  prompt: "How do you approve a PR?"
  assert:
    contains: ["LGTM"]

- name: "reviewer knows CHANGES REQUESTED keyword"
  agent: "reviewer"
  prompt: "How do you reject a PR that has issues?"
  assert:
    contains: ["CHANGES REQUESTED"]

- name: "reviewer checks CI status"
  agent: "reviewer"
  prompt: "What do you check before reviewing the code in a PR?"
  assert:
    contains: ["checks", "CI"]

- name: "reviewer returns results via session response"
  agent: "reviewer"
  prompt: "How do you communicate your review results?"
  assert:
    contains: ["session response"]
